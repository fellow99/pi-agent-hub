[package]
name = "pi-agent-hub-tray"
version = "0.1.0"
description = "pi-agent-hub tray supervisor"
edition = "2021"

[lib]
name = "pi_agent_hub_tray_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
