<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pi-agent-hub settings</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <h1>pi-agent-hub</h1>
      <p class="muted">sync-daemon supervisor · Windows / macOS</p>

      <section class="card">
        <h2>Daemon</h2>
        <div class="row">
          <button id="start">Start</button>
          <button id="stop">Stop</button>
          <button id="refresh" class="ghost">Refresh status</button>
        </div>
        <pre id="status">unknown</pre>
      </section>

      <section class="card">
        <h2>sync-daemon.json</h2>
        <label>Hub URL <input id="hubUrl" placeholder="https://hub.example.com" /></label>
        <label>Token <input id="hubToken" type="password" placeholder="phk_..." /></label>
        <label>Host name <input id="hostName" placeholder="laptop-win" /></label>
        <label>Plugin root <input id="pluginRoot" placeholder="~/.pi-agent-hub/plugins" /></label>
        <div class="row">
          <button id="save">Save</button>
          <button id="reload" class="ghost">Reload file</button>
        </div>
        <pre id="message"></pre>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
