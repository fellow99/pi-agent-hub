<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pi-agent-hub settings</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <section class="card autostart">
        <label class="toggle">
          <input type="checkbox" id="autostart" />
          开机自启
        </label>
      </section>

      <section class="card">
        <h2>同步状态</h2>
        <div class="status-row">
          <span id="statusLight" class="light off"></span>
          <span id="statusText" class="status-text">检测中…</span>
        </div>
      </section>

      <section class="card">
        <h2>同步配置</h2>
        <textarea id="configText" rows="18" spellcheck="false"></textarea>
        <div class="row">
          <button id="save" class="primary">保存并重启 daemon</button>
          <button id="reload" class="ghost">重新加载</button>
        </div>
        <pre id="message" class="message"></pre>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
