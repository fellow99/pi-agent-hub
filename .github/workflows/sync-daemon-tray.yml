name: sync-daemon-tray 打包

on:
  # 发版：push v* tag 自动触发（v0.1.0 → 工件名含 v0.1.0）
  push:
    tags:
      - 'v*'
  # 手动触发（调试用）
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win-x64
          # macOS 构建暂缓（待排查修复后恢复）：
          # - os: macos-14
          #   target: darwin-arm64
          # - os: macos-13
          #   target: darwin-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 24 (build host)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Build packages (daemon/plugins dist)
        run: pnpm build

      - name: Assemble resources (Node v26.13.0 + daemon + plugins + starter)
        run: node packages/sync-daemon-tray/scripts/assemble-resources.mjs --target ${{ matrix.target }}

      - name: Build Tauri bundle
        run: pnpm --filter @pi-agent-hub/sync-daemon-tray tauri:build

      - name: Upload artifacts (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: sync-daemon-tray-${{ matrix.target }}-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            packages/sync-daemon-tray/src-tauri/target/release/bundle/nsis/*.exe
            packages/sync-daemon-tray/src-tauri/target/release/bundle/dmg/*.dmg

  # 发版：build 全部完成后收集矩阵构件，自动创建 GitHub Release（仅 tag 触发）
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List downloaded artifacts
        run: find dist -maxdepth 3 -type f | sort

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/** \
            --repo "${{ github.repository }}" \
            --title "sync-daemon-tray ${{ github.ref_name }}" \
            --generate-notes \
            --verify-tag
