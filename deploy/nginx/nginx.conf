# ============================================================
# pi-agent-hub 对外反向代理（nginx:latest）
#
# 路由:
#   /api/*        -> hub-service:8443   （daemon REST + SSE + console API）
#   /hub/*        -> hub-console:80     （Vue3 SPA 静态资源）
#   /             -> 302 /hub/
#
# SSE( /api/v1/events ) 必须：关缓冲、关压缩、加长读超时
# ============================================================
server {
    listen 80;
    server_name _;

    # ---- 后端 API 与 SSE ----
    location /api/ {
        proxy_pass http://hub-service:8443;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE 必需：关闭代理缓冲/缓存/压缩，延长读写超时（心跳 15s）
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    # ---- 前端 SPA ----
    location /hub/ {
        proxy_pass http://hub-console:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = / {
        return 302 /hub/;
    }

    # 其余路径回前端（SPA 兜底）
    location / {
        return 302 /hub/;
    }
}
