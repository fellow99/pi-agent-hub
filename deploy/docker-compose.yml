# ============================================================
# pi-agent-hub Docker Compose 部署编排
#
# 服务清单:
#   1. hub-service  : node:24-alpine，运行 Express+node:sqlite 中心服务
#                    数据卷 ./data -> 容器内 /root/.pi-agent-hub
#   2. hub-console  : nginx:latest，托管 Vite 构建产物（编译阶段 node:24-alpine）
#   3. nginx        : nginx:latest，反向代理 hub-service 与 hub-console（对外入口）
#
# 使用方式:
#   docker compose -f deploy/docker-compose.yml up --build -d
#   # 打开 http://<host>:${HUB_HTTP_PORT:-8080}/hub/
# ============================================================

name: pi-agent-hub

services:

  # 1) 中心服务：存储/同步 API + SSE + 控制台 API
  hub-service:
    build:
      context: ..            # 构建上下文 = 仓库根（pnpm monorepo）
      dockerfile: deploy/hub-service/Dockerfile
    container_name: pi-hub-service
    restart: unless-stopped
    environment:
      PI_AGENT_HUB_HOME: /root/.pi-agent-hub
      HUB_CONFIG_FILE: /root/.pi-agent-hub/hub-service.json
      NODE_ENV: production
    volumes:
      # 宿主机 ./data 与容器家数据目录映射（hub.db / agent/sessions / logs 均在此）
      - ./data:/root/.pi-agent-hub
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('net').connect(8443,'127.0.0.1',()=>process.exit(0));s.on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - hub-network

  # 2) 前端静态服务器：Vite 构建产物（编译阶段 node:24-alpine，运行阶段 nginx:latest）
  hub-console:
    build:
      context: ..
      dockerfile: deploy/hub-console/Dockerfile
    container_name: pi-hub-console
    restart: unless-stopped
    depends_on:
      - hub-service
    networks:
      - hub-network

  # 3) 对外反向代理：/api/(v1|hub) -> hub-service；/hub/ -> hub-console
  nginx:
    image: nginx:latest
    container_name: pi-hub-nginx
    restart: unless-stopped
    ports:
      - "${HUB_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - hub-service
      - hub-console
    networks:
      - hub-network

networks:
  hub-network:
    name: pi-agent-hub-network
    driver: bridge
