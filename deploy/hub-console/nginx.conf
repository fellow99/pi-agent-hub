# ============================================================
# hub-console 静态服务器（nginx）
# 作用：仅托管 Vite 构建产物；SPA 路由回退到 /hub/index.html
# 注意：对外访问统一走反代 nginx（deploy/nginx/nginx.conf），本服务不直接暴露公网
# ============================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = / {
        return 302 /hub/;
    }

    location /hub/assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /hub/ {
        try_files $uri $uri/ /hub/index.html;
    }
}
